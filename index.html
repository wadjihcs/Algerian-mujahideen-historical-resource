<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>أبطال الثورة الجزائرية — Infinite Canvas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Playfair+Display:wght@400;700;900&family=Source+Serif+4:wght@300;400;600&display=swap');

  :root {
    --bg: #1e1b16; --bg-rgb: 30,27,22;
    --accent: #b8945a; --accent-dim: #9a8260; --accent-faint: #6a6050;
    --text: #e0d4be; --text-dim: #c0b498;
    --panel-bg: linear-gradient(165deg, #28241e 0%, #1e1b16 100%);
    --panel-border: rgba(184,148,90,0.25);
    --grain-opacity: 0.03; --scanline-opacity: 0.015; --vignette-strength: 0.45;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); overflow: hidden; cursor: grab; font-family: 'Playfair Display', serif; user-select: none; -webkit-user-select: none; transition: background 0.8s ease; }
  body:active { cursor: grabbing; }
  body.panel-open { cursor: default; }
  #canvas-container { position: fixed; inset: 0; z-index: 1; touch-action: none; }
  canvas { display: block; touch-action: none; }

  .overlay-top { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: 28px 36px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
  .logo { display: flex; flex-direction: column; gap: 4px; }
  .logo h1 { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 22px; color: var(--accent); letter-spacing: 4px; text-transform: uppercase; }
  .logo .subtitle { font-family: 'Amiri', serif; font-size: 18px; color: var(--accent-dim); direction: rtl; }
  .top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
  .nav-hint { font-family: 'Source Serif 4', serif; font-size: 12px; color: var(--accent-faint); letter-spacing: 2px; text-transform: uppercase; text-align: right; line-height: 1.8; }

  .overlay-bottom { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; padding: 24px 36px; display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; }
  .date-badge { font-family: 'Playfair Display', serif; font-size: 13px; color: var(--accent-faint); letter-spacing: 3px; border: 1px solid var(--panel-border); padding: 8px 16px; }
  .coordinates { font-family: 'Source Serif 4', serif; font-size: 11px; color: var(--accent-faint); letter-spacing: 1px; font-variant-numeric: tabular-nums; opacity: 0.6; }
  .vignette { position: fixed; inset: 0; z-index: 5; pointer-events: none; background: radial-gradient(ellipse at center, transparent 40%, rgba(var(--bg-rgb), var(--vignette-strength)) 100%); transition: background 0.8s ease; }
  .grain { position: fixed; inset: 0; z-index: 6; pointer-events: none; opacity: var(--grain-opacity); background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); background-size: 128px; mix-blend-mode: overlay; transition: opacity 0.8s ease; }
  .scanlines { position: fixed; inset: 0; z-index: 6; pointer-events: none; background: repeating-linear-gradient(to bottom, transparent, transparent 2px, rgba(var(--bg-rgb), var(--scanline-opacity)) 2px, rgba(var(--bg-rgb), var(--scanline-opacity)) 4px); }

  .intro-overlay { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 1.5s ease, visibility 1.5s ease; padding: 24px; text-align: center; }
  .intro-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .intro-overlay h2 { font-family: 'Amiri', serif; font-size: 42px; color: var(--accent); margin-bottom: 8px; direction: rtl; }
  .intro-overlay p { font-family: 'Source Serif 4', serif; font-size: 16px; color: var(--accent-dim); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 40px; }
  .intro-overlay .enter-btn { font-family: 'Playfair Display', serif; font-size: 14px; color: var(--accent); letter-spacing: 4px; text-transform: uppercase; border: 1px solid var(--accent); padding: 14px 40px; background: transparent; cursor: pointer; transition: all 0.4s ease; }
  .intro-overlay .enter-btn:hover { background: var(--accent); color: var(--bg); }
  .intro-overlay .star { width: 40px; height: 40px; margin-bottom: 24px; }

  /* DETAIL PANEL */
  .detail-overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: flex-end; opacity: 0; visibility: hidden; transition: opacity 0.6s ease, visibility 0.6s ease; pointer-events: none; }
  .detail-overlay.visible { opacity: 1; visibility: visible; pointer-events: auto; }
  .detail-backdrop { position: absolute; inset: 0; background: rgba(var(--bg-rgb), 0.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .detail-panel { position: relative; z-index: 2; width: 460px; max-width: 92vw; max-height: 88vh; margin-right: 40px; background: var(--panel-bg); border: 1px solid var(--panel-border); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; transform: translateX(60px); transition: transform 0.6s cubic-bezier(0.16,1,0.3,1); }
  .detail-overlay.visible .detail-panel { transform: translateX(0); }
  .detail-panel::-webkit-scrollbar { width: 4px; }
  .detail-panel::-webkit-scrollbar-track { background: transparent; }
  .detail-panel::-webkit-scrollbar-thumb { background: rgba(201,169,110,0.2); border-radius: 2px; }

  .detail-photo-wrap { width: 100%; height: 240px; overflow: hidden; position: relative; background: rgba(var(--bg-rgb), 0.8); }
  .detail-photo { width: 100%; height: 100%; object-fit: cover; object-position: top center; filter: sepia(0.25) contrast(1.05) brightness(0.95); opacity: 0; transition: opacity 0.6s ease; }
  .detail-photo.is-portrait { object-fit: contain; object-position: center; background: rgba(var(--bg-rgb), 1); padding: 8px 0; }
  .detail-photo.loaded { opacity: 1; }
  .detail-photo-fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .detail-photo-fallback svg { width: 60px; height: 60px; opacity: 0.12; }
  .detail-photo-gradient { position: absolute; bottom: 0; left: 0; right: 0; height: 80px; background: linear-gradient(transparent, rgba(var(--bg-rgb), 1)); pointer-events: none; }
  .detail-close { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; background: rgba(var(--bg-rgb),0.7); border: 1px solid rgba(201,169,110,0.3); color: var(--accent); font-size: 18px; cursor: pointer; z-index: 5; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; line-height: 1; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); border-radius: 4px; }
  .detail-close:hover { background: rgba(201,169,110,0.2); border-color: var(--accent); }

  .detail-header { padding: 20px 32px 20px; }
  .detail-type { font-family: 'Source Serif 4', serif; font-size: 10px; color: var(--accent-dim); letter-spacing: 4px; text-transform: uppercase; margin-bottom: 10px; }
  .detail-name-ar { font-family: 'Amiri', serif; font-size: 30px; color: var(--text); direction: rtl; margin-bottom: 4px; line-height: 1.3; }
  .detail-name-latin { font-family: 'Playfair Display', serif; font-size: 19px; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
  .detail-years { font-family: 'Source Serif 4', serif; font-size: 14px; color: var(--accent-dim); }
  .detail-role { font-family: 'Source Serif 4', serif; font-size: 13px; color: var(--accent-dim); font-style: italic; margin-top: 6px; }
  .detail-body { padding: 20px 32px 32px; }
  .detail-summary-en { font-family: 'Source Serif 4', serif; font-size: 14.5px; color: var(--text-dim); line-height: 1.8; margin-bottom: 20px; }
  .detail-summary-ar { font-family: 'Amiri', serif; font-size: 17px; color: var(--text-dim); line-height: 2; direction: rtl; text-align: right; padding: 16px 20px; border-right: 3px solid var(--accent); background: rgba(var(--bg-rgb), 0.3); margin-bottom: 20px; border-radius: 0 4px 4px 0; }
  .lang-label { font-family: 'Source Serif 4', serif; font-size: 10px; color: var(--accent-dim); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .lang-label::after { content: ''; flex: 1; height: 1px; background: var(--panel-border); }
  .detail-divider { width: 40px; height: 1px; background: var(--panel-border); margin: 20px 0; }
  .detail-quote { font-family: 'Amiri', serif; font-size: 18px; color: var(--accent); direction: rtl; text-align: right; line-height: 1.7; padding: 14px 0; border-top: 1px solid rgba(201,169,110,0.1); border-bottom: 1px solid rgba(201,169,110,0.1); font-style: italic; }
  .detail-star { display: flex; justify-content: center; margin-top: 20px; opacity: 0.3; }
  .click-hint { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); z-index: 10; font-family: 'Source Serif 4', serif; font-size: 12px; color: var(--accent-faint); letter-spacing: 2px; text-transform: uppercase; pointer-events: none; opacity: 0; transition: opacity 0.5s ease; }
  .click-hint.visible { opacity: 1; }

  /* TABLET */
  @media (max-width: 1024px) {
    .overlay-top { padding: 22px 28px; } .overlay-bottom { padding: 20px 28px; }
    .detail-panel { width: 400px; margin-right: 28px; }
  }
  /* SMALL TABLET */
  @media (max-width: 768px) {
    .overlay-top { padding: 18px 20px; } .overlay-bottom { padding: 16px 20px; }
    .logo h1 { font-size: 18px; letter-spacing: 2px; } .logo .subtitle { font-size: 15px; }
    .nav-hint { font-size: 11px; } .intro-overlay h2 { font-size: 34px; }
    .detail-overlay { align-items: flex-end; justify-content: center; }
    .detail-panel { width: 100vw; max-width: 100vw; margin: 0; max-height: 80vh; border-radius: 16px 16px 0 0; border-bottom: none; transform: translateY(100%); }
    .detail-overlay.visible .detail-panel { transform: translateY(0); }
    .detail-panel::before { content: ''; display: block; width: 40px; height: 4px; background: rgba(201,169,110,0.3); border-radius: 2px; margin: 10px auto 0; }
    .detail-header { padding: 16px 24px; } .detail-body { padding: 16px 24px 28px; }
    .detail-photo-wrap { height: 200px; } .detail-close { top: 10px; right: 10px; }
  }
  /* PHONE */
  @media (max-width: 480px) {
    .overlay-top { padding: 14px 14px; } .overlay-bottom { padding: 12px 14px; }
    .logo h1 { font-size: 15px; letter-spacing: 1.5px; } .logo .subtitle { font-size: 13px; }
    .nav-hint { font-size: 9px; } .top-right { gap: 8px; }
    .intro-overlay h2 { font-size: 26px; } .intro-overlay p { font-size: 11px; margin-bottom: 30px; }
    .intro-overlay .enter-btn { font-size: 12px; padding: 12px 28px; } .intro-overlay .star { width: 32px; height: 32px; }
    .detail-panel { max-height: 82vh; border-radius: 14px 14px 0 0; }
    .detail-photo-wrap { height: 160px; } .detail-close { width: 32px; height: 32px; font-size: 15px; }
    .detail-header { padding: 14px 16px; } .detail-body { padding: 14px 16px 24px; }
    .detail-name-ar { font-size: 22px; } .detail-name-latin { font-size: 15px; }
    .detail-summary-en { font-size: 13px; } .detail-summary-ar { font-size: 15px; padding: 12px 14px; }
    .detail-quote { font-size: 16px; }
    .date-badge { font-size: 10px; padding: 5px 10px; } .coordinates { font-size: 9px; }
    .click-hint { font-size: 10px; bottom: 44px; }
  }
  @media (max-width: 360px) {
    .logo h1 { font-size: 13px; } .intro-overlay h2 { font-size: 22px; }
    .detail-name-ar { font-size: 20px; } .detail-photo-wrap { height: 130px; }
  }
  /* LANDSCAPE PHONE */
  @media (max-height: 500px) and (orientation: landscape) {
    .overlay-top { padding: 10px 20px; } .overlay-bottom { padding: 8px 20px; }
    .logo h1 { font-size: 14px; } .logo .subtitle { display: none; }
    .intro-overlay h2 { font-size: 24px; } .intro-overlay p { margin-bottom: 20px; }
    .detail-overlay { align-items: center; justify-content: flex-end; }
    .detail-panel { width: 380px; max-width: 50vw; max-height: 94vh; margin-right: 20px; border-radius: 0; transform: translateX(100%); }
    .detail-overlay.visible .detail-panel { transform: translateX(0); }
    .detail-panel::before { display: none; }
    .detail-photo-wrap { height: 120px; }
  }
  @media (pointer: coarse) { body, body:active { cursor: default; } }
  @supports (padding: env(safe-area-inset-top)) {
    .overlay-top { padding-top: max(14px, env(safe-area-inset-top)); }
    .overlay-bottom { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    .detail-panel { padding-bottom: env(safe-area-inset-bottom); }
  }
</style>
</head>
<body>

<div class="intro-overlay" id="intro">
  <svg class="star" viewBox="0 0 100 100"><path d="M50 5 L61 39 L97 39 L68 60 L79 95 L50 73 L21 95 L32 60 L3 39 L39 39 Z" fill="currentColor" style="color:var(--accent)"/><circle cx="50" cy="50" r="12" fill="currentColor" style="color:var(--bg)"/></svg>
  <h2>أبطال الثورة الجزائرية</h2>
  <p>Heroes of the Algerian Revolution</p>

</div>

</div>

<script type="module">

const PHOTOS = {
  benMhidi: "https://upload.wikimedia.org/wikipedia/commons/2/2b/Larbi_Ben_M%27hidi_-_1957.JPG",
  benBoulaid: "https://upload.wikimedia.org/wikipedia/commons/c/c7/Mostefa_Ben_Boula%C3%AFd.jpg",
  didouche: "https://upload.wikimedia.org/wikipedia/commons/3/35/Didouche_Mourad_2.jpg",
  krim: "https://upload.wikimedia.org/wikipedia/commons/d/d0/Krim_Belkacem.jpg",
  bitat: "https://upload.wikimedia.org/wikipedia/commons/c/c3/Rabah_Bitat.jpg",
  boudiaf: "https://upload.wikimedia.org/wikipedia/commons/a/a2/Mohamed_Boudiaf.jpg",

  benBella: "https://upload.wikimedia.org/wikipedia/commons/d/d8/Ahmed_Ben_Bella.jpg",
  bouhired: "https://upload.wikimedia.org/wikipedia/commons/b/b3/Djamila_Bouhired.jpg",
  hassiba: "https://upload.wikimedia.org/wikipedia/commons/1/13/Hassiba_Ben_Bouali.jpg",

};

const CARDS = [
  { name:"لعربي بن مهيدي", latin:"Larbi Ben M'hidi", year:"1923–1957", role:"Leader of Zone V (Oran)", color:"#8B4513", type:"HISTORIC LEADER", portrait:true, photo:PHOTOS.benMhidi,
    summary:"One of the nine historic founders of the FLN and leader of Zone V. He commanded urban guerrilla operations during the Battle of Algiers. Captured in February 1957, he was tortured and assassinated by the French military who staged his death as a suicide. His defiance became legendary.",
    summaryAr:"أحد المؤسسين التسعة التاريخيين لجبهة التحرير الوطني وقائد المنطقة الخامسة. قاد عمليات حرب العصابات الحضرية خلال معركة الجزائر. اعتُقل في فبراير 1957، وتعرض للتعذيب ثم اغتيل من طرف الجيش الفرنسي الذي زيّف موته على أنه انتحار. أصبح تحديه أسطورياً.",
    quote:"أعطونا طائراتكم ودباباتكم نعطيكم قفافنا" },
  { name:"مصطفى بن بولعيد", latin:"Mostefa Ben Boulaïd", year:"1917–1956", role:"Leader of Zone I (Aurès)", color:"#6B3410", type:"HISTORIC LEADER", portrait:true, photo:PHOTOS.benBoulaid,
    summary:"Known as the 'Father of the Revolution.' A WWII veteran, he sold his properties to buy the first weapons for November 1st, 1954. After escaping prison, he was killed on March 22, 1956 by a booby-trapped radio planted by French intelligence.",
    summaryAr:"يُلقب بـ'أبو الثورة'. محارب في الحرب العالمية الثانية، باع ممتلكاته لشراء أول أسلحة الثورة. بعد هروبه من السجن، استشهد في 22 مارس 1956 بجهاز راديو مفخخ زرعته المخابرات الفرنسية.",
    quote:"نموت ونحيا ونموت حتى تحيا الجزائر" },
  { name:"ديدوش مراد", latin:"Didouche Mourad", year:"1927–1955", role:"Leader of Zone II (North Constantine)", color:"#4A5530", type:"HISTORIC LEADER", portrait:true, photo:PHOTOS.didouche,
    summary:"The youngest of the nine historic leaders. He played a key role in drafting the November 1st Declaration. He fell in battle on January 18, 1955 — the first of the nine to die in combat, at 27 years old.",
    summaryAr:"أصغر القادة التاريخيين التسعة. لعب دوراً محورياً في صياغة بيان أول نوفمبر. استشهد في المعركة يوم 18 جانفي 1955 — أول القادة التسعة سقوطاً في الميدان، عن عمر 27 سنة.",
    quote:"نحن ثوار قمنا لنحيا فلا بد أن نمضي في طريقنا" },
  { name:"كريم بلقاسم", latin:"Krim Belkacem", year:"1922–1970", role:"Leader of Zone III (Kabylie)", color:"#3E4A3A", type:"HISTORIC LEADER", portrait:true, photo:PHOTOS.krim,
    summary:"A guerrilla fighter since 1947. He transformed Kabylie into a fortress of resistance and became the chief negotiator and signatory of the Évian Accords in March 1962. Assassinated in Frankfurt in 1970.",
    summaryAr:"مقاتل عصابات منذ 1947. حوّل القبائل إلى حصن للمقاومة وأصبح المفاوض الرئيسي والموقّع على اتفاقيات إيفيان في مارس 1962. اغتيل في فرانكفورت عام 1970.",
    quote:"الحرية لا تُعطى بل تُنتزع انتزاعاً" },
  { name:"رابح بيطاط", latin:"Rabah Bitat", year:"1925–2000", role:"Leader of Zone IV (Algiers)", color:"#4A3B2A", type:"HISTORIC LEADER", portrait:true, photo:PHOTOS.bitat,
    summary:"Leader of Zone IV covering Algiers. Arrested in March 1955 as the first historic leader captured. After independence he served as President of the National Assembly.",
    summaryAr:"قائد المنطقة الرابعة. اعتُقل في مارس 1955 كأول قائد تاريخي يُقبض عليه. بعد الاستقلال شغل منصب رئيس المجلس الشعبي الوطني.",
    quote:"نحن لم نختر الحرب، الاستعمار هو من فرضها علينا" },

function mkTex(card){const c=document.createElement('canvas');c.width=512;c.height=640;const x=c.getContext('2d');const bg=x.createLinearGradient(0,0,0,640);bg.addColorStop(0,card.color);bg.addColorStop(1,dk(card.color,0.4));x.fillStyle=bg;x.fillRect(0,0,512,640);x.globalAlpha=0.08;for(let i=0;i<2000;i++){x.fillStyle=Math.random()>0.5?'#fff':'#000';x.fillRect(Math.random()*512,Math.random()*640,1,1)}x.globalAlpha=1;x.strokeStyle='rgba(201,169,110,0.3)';x.lineWidth=2;x.strokeRect(16,16,480,608);x.strokeRect(20,20,472,600);drawS(x,256,150,50,'#c9a96e',0.25);x.fillStyle='rgba(201,169,110,0.45)';x.font='12px sans-serif';x.textAlign='center';x.fillText((card.type||'').toUpperCase(),256,210);x.strokeStyle='rgba(201,169,110,0.4)';x.lineWidth=1;x.beginPath();x.moveTo(120,230);x.lineTo(392,230);x.stroke();x.fillStyle='#e8d5a8';x.font='bold 36px Amiri,serif';x.textBaseline='middle';x.fillText(card.name,256,285);x.fillStyle='rgba(201,169,110,0.9)';x.font='22px Playfair Display,serif';x.fillText(card.latin,256,335);x.fillStyle='rgba(201,169,110,0.6)';x.font='18px serif';x.fillText(card.year,256,385);x.strokeStyle='rgba(201,169,110,0.25)';x.beginPath();x.moveTo(160,415);x.lineTo(352,415);x.stroke();x.fillStyle='rgba(232,213,168,0.6)';x.font='15px serif';x.fillText(card.role,256,450);x.fillStyle='rgba(201,169,110,0.3)';x.font='11px sans-serif';x.fillText('— CLICK TO READ —',256,520);dC(x,30,30,1,1);dC(x,482,30,-1,1);dC(x,30,610,1,-1);dC(x,482,610,-1,-1);const t=new THREE.CanvasTexture(c);t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t}
function drawS(x,cx,cy,r,col,a){x.globalAlpha=a;x.fillStyle=col;x.beginPath();for(let i=0;i<5;i++){const an=(i*4*Math.PI)/5-Math.PI/2;i===0?x.moveTo(cx+r*Math.cos(an),cy+r*Math.sin(an)):x.lineTo(cx+r*Math.cos(an),cy+r*Math.sin(an))}x.closePath();x.fill();x.globalAlpha=a*0.8;x.strokeStyle=col;x.lineWidth=2;x.beginPath();x.arc(cx,cy,r*0.35,0,Math.PI*2);x.stroke();x.globalAlpha=1}
function dC(x,px,py,dx,dy){x.strokeStyle='rgba(201,169,110,0.25)';x.lineWidth=1;x.beginPath();x.moveTo(px,py+dy*20);x.lineTo(px,py);x.lineTo(px+dx*20,py);x.stroke()}
function dk(h,a){const n=parseInt(h.replace('#',''),16);return`rgb(${Math.max(0,((n>>16)&0xff)*(1-a))|0},${Math.max(0,((n>>8)&0xff)*(1-a))|0},${Math.max(0,(n&0xff)*(1-a))|0})`}

const CS=6,RR=isMobile?2:3,CW=2.4,CH=3,chunks=new Map(),texs=CARDS.map(c=>mkTex(c)),geo=new THREE.PlaneGeometry(CW,CH);
function cK(a,b){return`${a},${b}`}function cF(a,b){return Math.abs(((a*73856093)^(b*19349663))%CARDS.length)}
function mkCh(cx,cy){const k=cK(cx,cy);if(chunks.has(k))return;const g=new THREE.Group(),s=Math.abs((cx*7+cy*13)%17),cnt=2+(s%2);for(let i=0;i<cnt;i++){const ci=cF(cx+i*3,cy+i*7),mat=new THREE.MeshStandardMaterial({map:texs[ci],roughness:0.7,metalness:0.1,transparent:true,opacity:0}),m=new THREE.Mesh(geo,mat);m.position.set(cx*CS+((i*2.7+s*0.3)%CS)-CS/2,cy*CS+((i*3.1+s*0.7)%CS)-CS/2,-Math.random()*3);m.rotation.z=(Math.random()-0.5)*0.08;m.rotation.x=(Math.random()-0.5)*0.04;m.userData={material:mat,cardIndex:ci};g.add(m)}scene.add(g);chunks.set(k,g)}
function rmCh(cx,cy){const k=cK(cx,cy),g=chunks.get(k);if(!g)return;g.traverse(c=>{if(c.isMesh)c.material.dispose()});scene.remove(g);chunks.delete(k)}
function updCh(){const ccx=Math.round(camera.position.x/CS),ccy=Math.round(camera.position.y/CS);for(let dx=-RR;dx<=RR;dx++)for(let dy=-RR;dy<=RR;dy++)mkCh(ccx+dx,ccy+dy);for(const[k]of chunks){const[cx,cy]=k.split(',').map(Number);if(Math.abs(cx-ccx)>RR+1||Math.abs(cy-ccy)>RR+1)rmCh(cx,cy)}}
function updFade(){const cp=camera.position;scene.traverse(c=>{if(!c.isMesh||!c.userData.material)return;const d=c.position.distanceTo(cp);let o=d>14?1-Math.min(1,(d-14)/8):1;c.userData.material.opacity+=(Math.max(0,Math.min(1,o))-c.userData.material.opacity)*0.08})}

const pN=isMobile?80:200,pG=new THREE.BufferGeometry(),pP=new Float32Array(pN*3);
for(let i=0;i<pN;i++){pP[i*3]=(Math.random()-0.5)*40;pP[i*3+1]=(Math.random()-0.5)*40;pP[i*3+2]=(Math.random()-0.5)*20}

const ray=new THREE.Raycaster(),mV=new THREE.Vector2();

function showDetail(i){
  const c=CARDS[i],photo=document.getElementById('detailPhoto');
  document.getElementById('detailType').textContent=c.type;
  document.getElementById('detailNameAr').textContent=c.name;
  document.getElementById('detailNameLatin').textContent=c.latin;
  document.getElementById('detailYears').textContent=c.year;
  document.getElementById('detailRole').textContent=c.role;
  document.getElementById('detailSummaryEn').textContent=c.summary;
  document.getElementById('detailSummaryAr').textContent=c.summaryAr;
  document.getElementById('detailQuote').textContent=`« ${c.quote} »`;

  photo.classList.remove('loaded','is-portrait');
  photo.src='';
  if(c.portrait) photo.classList.add('is-portrait');

  dOv.classList.add('visible');
  document.body.classList.add('panel-open');
  panelOpen=true;

  if(c.photo){
    photo.src=c.photo;
    photo.onload=()=>photo.classList.add('loaded');
    photo.onerror=()=>{
      // Fallback: try Wikipedia REST API
      fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${c.latin.replace(/ /g,'_').replace(/'/g,"%27")}`)
        .then(r=>r.json()).then(d=>{if(d.thumbnail){photo.src=d.thumbnail.source;photo.onload=()=>photo.classList.add('loaded')}}).catch(()=>{});
    };
  }
}

let drag=false,prev={x:0,y:0},vel={x:0,y:0,z:0};
const DMP=0.92,DSP=isMobile?0.016:0.012;

renderer.domElement.addEventListener('pointerdown',e=>{if(panelOpen)return;drag=true;prev={x:e.clientX,y:e.clientY};cStart={x:e.clientX,y:e.clientY};wasDrag=false});
window.addEventListener('pointermove',e=>{if(!drag||panelOpen)return;vel.x-=(e.clientX-prev.x)*DSP;vel.y+=(e.clientY-prev.y)*DSP;prev={x:e.clientX,y:e.clientY};if(Math.abs(e.clientX-cStart.x)+Math.abs(e.clientY-cStart.y)>(isMobile?10:6))wasDrag=true});
window.addEventListener('pointerup',e=>{drag=false;if(!wasDrag&&!panelOpen){mV.x=(e.clientX/window.innerWidth)*2-1;mV.y=-(e.clientY/window.innerHeight)*2+1;ray.setFromCamera(mV,camera);const ms=[];scene.traverse(c=>{if(c.isMesh&&c.userData.cardIndex!==undefined)ms.push(c)});const h=ray.intersectObjects(ms);if(h.length>0){const o=h[0].object;fTarget=o;fProg=0;fStart.copy(camera.position);fEnd.set(o.position.x,o.position.y,o.position.z+5);vel.x=0;vel.y=0;vel.z=0;setTimeout(()=>showDetail(o.userData.cardIndex),400)}}});

renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2&&!panelOpen){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,d=Math.sqrt(dx*dx+dy*dy);vel.z+=(lTD-d)*0.008;lTD=d}},{passive:true});

function pK(){if(panelOpen)return;const s=0.04;if(keys.ArrowLeft||keys.a)vel.x-=s;if(keys.ArrowRight||keys.d)vel.x+=s;if(keys.ArrowUp||keys.w)vel.y+=s;if(keys.ArrowDown||keys.s)vel.y-=s}

pK();

else if(!panelOpen){vel.x*=DMP;vel.y*=DMP;vel.z*=DMP;camera.position.x+=vel.x;camera.position.y+=vel.y;camera.position.z=Math.max(4,Math.min(20,camera.position.z+vel.z))}

const pp=pG.attributes.position.array;for(let i=0;i<pN;i++){pp[i*3+1]+=Math.sin(time+i)*0.001;pp[i*3]+=Math.cos(time*0.7+i*0.5)*0.0005}pG.attributes.position.needsUpdate=true;
