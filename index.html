<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>أبطال الثورة الجزائرية — Infinite Canvas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Playfair+Display:wght@400;700;900&family=Source+Serif+4:wght@300;400;600&display=swap');
  :root { --bg:#1e1b16;--bg-rgb:30,27,22;--accent:#b8945a;--accent-dim:#9a8260;--accent-faint:#6a6050;--text:#e0d4be;--text-dim:#c0b498;--panel-bg:linear-gradient(165deg,#28241e 0%,#1e1b16 100%);--panel-border:rgba(184,148,90,0.25);--grain-opacity:0.03;--vignette-strength:0.45; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);overflow:hidden;cursor:grab;font-family:'Playfair Display',serif;user-select:none;-webkit-user-select:none}
  body:active{cursor:grabbing}body.panel-open{cursor:default}
  #canvas-container{position:fixed;inset:0;z-index:1;touch-action:none}
  canvas{display:block;touch-action:none}

  .overlay-top{position:fixed;top:0;left:0;right:0;z-index:10;padding:28px 36px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
  .logo{display:flex;flex-direction:column;gap:4px}
  .logo h1{font-family:'Playfair Display',serif;font-weight:900;font-size:22px;color:var(--accent);letter-spacing:4px;text-transform:uppercase}
  .logo .subtitle{font-family:'Amiri',serif;font-size:18px;color:var(--accent-dim);direction:rtl}
  .top-right{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
  .nav-hint{font-family:'Source Serif 4',serif;font-size:12px;color:var(--accent-faint);letter-spacing:2px;text-transform:uppercase;text-align:right;line-height:1.8}
  .overlay-bottom{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:24px 36px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
  .date-badge{font-family:'Playfair Display',serif;font-size:13px;color:var(--accent-faint);letter-spacing:3px;border:1px solid var(--panel-border);padding:8px 16px}
  .coordinates{font-family:'Source Serif 4',serif;font-size:11px;color:var(--accent-faint);letter-spacing:1px;font-variant-numeric:tabular-nums;opacity:0.6}
  .vignette{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(var(--bg-rgb),var(--vignette-strength)) 100%)}
  .grain{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:var(--grain-opacity);background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:128px;mix-blend-mode:overlay}
  .scanlines{position:fixed;inset:0;z-index:6;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent,transparent 2px,rgba(var(--bg-rgb),0.015) 2px,rgba(var(--bg-rgb),0.015) 4px)}
  .intro-overlay{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1.5s ease,visibility 1.5s ease;padding:24px;text-align:center}
  .intro-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .intro-overlay h2{font-family:'Amiri',serif;font-size:42px;color:var(--accent);margin-bottom:8px;direction:rtl}
  .intro-overlay p{font-family:'Source Serif 4',serif;font-size:16px;color:var(--accent-dim);letter-spacing:3px;text-transform:uppercase;margin-bottom:40px}
  .intro-overlay .enter-btn{font-family:'Playfair Display',serif;font-size:14px;color:var(--accent);letter-spacing:4px;text-transform:uppercase;border:1px solid var(--accent);padding:14px 40px;background:transparent;cursor:pointer;transition:all 0.4s ease}
  .intro-overlay .enter-btn:hover{background:var(--accent);color:var(--bg)}
  .intro-overlay .star{width:40px;height:40px;margin-bottom:24px}

  /* TOOLBAR */
  .toolbar{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);z-index:12;display:flex;gap:6px;pointer-events:auto}
  .tool-btn{width:44px;height:44px;border-radius:50%;background:rgba(var(--bg-rgb),0.85);border:1px solid var(--panel-border);color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.3s ease;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:18px}
  .tool-btn:hover,.tool-btn:active{background:rgba(184,148,90,0.2);border-color:var(--accent)}
  .tool-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .card-counter{font-family:'Source Serif 4',serif;font-size:10px;color:var(--accent-dim);text-align:center;margin-top:4px;letter-spacing:1px}

  /* DIRECTORY DRAWER */
  .directory{position:fixed;left:0;top:0;bottom:0;width:320px;max-width:85vw;z-index:55;background:var(--panel-bg);border-right:1px solid var(--panel-border);transform:translateX(-100%);transition:transform 0.5s cubic-bezier(0.16,1,0.3,1);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .directory.open{transform:translateX(0)}
  .directory-header{padding:28px 24px 20px;border-bottom:1px solid var(--panel-border);display:flex;justify-content:space-between;align-items:center}
  .directory-title{font-family:'Playfair Display',serif;font-size:16px;color:var(--accent);letter-spacing:2px}
  .directory-close{width:32px;height:32px;border:1px solid var(--panel-border);background:transparent;color:var(--accent);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:4px}
  .directory-section{padding:16px 24px 8px;font-family:'Source Serif 4',serif;font-size:9px;color:var(--accent-faint);letter-spacing:3px;text-transform:uppercase}

  .directory-item .di-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .directory-item .di-info{flex:1;min-width:0}
  .directory-item .di-name{font-family:'Amiri',serif;font-size:16px;color:var(--text);direction:rtl;text-align:right;line-height:1.3}
  .directory-item .di-latin{font-family:'Source Serif 4',serif;font-size:12px;color:var(--accent-dim);margin-top:2px}
  .directory-backdrop{position:fixed;inset:0;z-index:54;background:rgba(0,0,0,0.4);opacity:0;visibility:hidden;transition:all 0.4s ease}
  .directory-backdrop.visible{opacity:1;visibility:visible}

  /* DETAIL PANEL */
  .detail-overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:flex-end;opacity:0;visibility:hidden;transition:opacity 0.6s ease,visibility 0.6s ease;pointer-events:none}
  .detail-overlay.visible{opacity:1;visibility:visible;pointer-events:auto}
  .detail-backdrop{position:absolute;inset:0;background:rgba(var(--bg-rgb),0.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .detail-panel{position:relative;z-index:2;width:460px;max-width:92vw;max-height:88vh;margin-right:40px;background:var(--panel-bg);border:1px solid var(--panel-border);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;transform:translateX(60px);transition:transform 0.6s cubic-bezier(0.16,1,0.3,1)}
  .detail-overlay.visible .detail-panel{transform:translateX(0)}
  .detail-panel::-webkit-scrollbar{width:4px}.detail-panel::-webkit-scrollbar-track{background:transparent}.detail-panel::-webkit-scrollbar-thumb{background:rgba(201,169,110,0.2);border-radius:2px}
  .detail-photo-wrap{width:100%;height:260px;overflow:hidden;position:relative;background:#151310}
  .detail-photo{width:100%;height:100%;object-fit:cover;object-position:center 20%;filter:sepia(0.15) contrast(1.05);opacity:0;transition:opacity 0.6s ease;display:block}
  .detail-photo.is-person{object-fit:contain;object-position:center center;background:#0e0c0a;padding:6px}
  .detail-photo.loaded{opacity:1}
  .detail-photo-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px}
  .detail-photo-fallback svg{width:50px;height:50px;opacity:0.12}
  .loading-text{font-family:'Source Serif 4',serif;font-size:10px;color:var(--accent-faint);letter-spacing:2px;text-transform:uppercase;opacity:0.5}
  .detail-photo-gradient{position:absolute;bottom:0;left:0;right:0;height:80px;background:linear-gradient(transparent,rgba(var(--bg-rgb),1));pointer-events:none}
  .detail-close{position:absolute;top:12px;right:12px;width:36px;height:36px;background:rgba(var(--bg-rgb),0.7);border:1px solid rgba(201,169,110,0.3);color:var(--accent);font-size:18px;cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center;transition:all 0.3s ease;line-height:1;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border-radius:4px}
  .detail-close:hover{background:rgba(201,169,110,0.2);border-color:var(--accent)}
  .detail-header{padding:20px 32px 20px}
  .detail-type{font-family:'Source Serif 4',serif;font-size:10px;color:var(--accent-dim);letter-spacing:4px;text-transform:uppercase;margin-bottom:10px}
  .detail-name-ar{font-family:'Amiri',serif;font-size:30px;color:var(--text);direction:rtl;margin-bottom:4px;line-height:1.3}
  .detail-name-latin{font-family:'Playfair Display',serif;font-size:19px;color:var(--accent);font-weight:700;margin-bottom:4px}
  .detail-years{font-family:'Source Serif 4',serif;font-size:14px;color:var(--accent-dim)}
  .detail-role{font-family:'Source Serif 4',serif;font-size:13px;color:var(--accent-dim);font-style:italic;margin-top:6px}
  .detail-location{font-family:'Source Serif 4',serif;font-size:11px;color:var(--accent-dim);letter-spacing:1px;margin-top:8px;display:flex;align-items:center;gap:6px}
  .detail-location::before{content:'◆';font-size:6px;color:var(--accent)}
  .detail-body{padding:20px 32px 32px}
  .detail-summary-en{font-family:'Source Serif 4',serif;font-size:14.5px;color:var(--text-dim);line-height:1.8;margin-bottom:20px}
  .detail-summary-ar{font-family:'Amiri',serif;font-size:17px;color:var(--text-dim);line-height:2;direction:rtl;text-align:right;padding:16px 20px;border-right:3px solid var(--accent);background:rgba(var(--bg-rgb),0.3);margin-bottom:20px;border-radius:0 4px 4px 0}
  .lang-label{font-family:'Source Serif 4',serif;font-size:10px;color:var(--accent-dim);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .lang-label::after{content:'';flex:1;height:1px;background:var(--panel-border)}
  .detail-divider{width:40px;height:1px;background:var(--panel-border);margin:20px 0}
  .detail-quote{font-family:'Amiri',serif;font-size:18px;color:var(--accent);direction:rtl;text-align:right;line-height:1.7;padding:14px 0;border-top:1px solid rgba(201,169,110,0.1);border-bottom:1px solid rgba(201,169,110,0.1);font-style:italic}
  .detail-star{display:flex;justify-content:center;margin-top:20px;opacity:0.3}
  .click-hint{position:fixed;bottom:126px;left:50%;transform:translateX(-50%);z-index:10;font-family:'Source Serif 4',serif;font-size:12px;color:var(--accent-faint);letter-spacing:2px;text-transform:uppercase;pointer-events:none;opacity:0;transition:opacity 0.5s ease}
  .click-hint.visible{opacity:1}

  /* TABLET */
  @media(max-width:1024px){.overlay-top{padding:22px 28px}.overlay-bottom{padding:20px 28px}.detail-panel{width:400px;margin-right:28px}}
  @media(max-width:768px){
    .overlay-top{padding:18px 20px}.overlay-bottom{padding:16px 20px}
    .logo h1{font-size:18px;letter-spacing:2px}.logo .subtitle{font-size:15px}.nav-hint{font-size:11px}
    .intro-overlay h2{font-size:34px}
    .detail-overlay{align-items:flex-end;justify-content:center}
    .detail-panel{width:100vw;max-width:100vw;margin:0;max-height:80vh;border-radius:16px 16px 0 0;border-bottom:none;transform:translateY(100%)}
    .detail-overlay.visible .detail-panel{transform:translateY(0)}
    .detail-panel::before{content:'';display:block;width:40px;height:4px;background:rgba(201,169,110,0.3);border-radius:2px;margin:10px auto 0}
    .detail-header{padding:16px 24px}.detail-body{padding:16px 24px 28px}
    .detail-photo-wrap{height:200px}.detail-close{top:10px;right:10px}
    .toolbar{bottom:62px}.tool-btn{width:40px;height:40px}
    .directory{width:280px}
  }
  @media(max-width:480px){
    .overlay-top{padding:14px 14px}.overlay-bottom{padding:12px 14px}
    .logo h1{font-size:15px;letter-spacing:1.5px}.logo .subtitle{font-size:13px}.nav-hint{font-size:9px}.top-right{gap:8px}
    .intro-overlay h2{font-size:26px}.intro-overlay p{font-size:11px;margin-bottom:30px}.intro-overlay .enter-btn{font-size:12px;padding:12px 28px}.intro-overlay .star{width:32px;height:32px}
    .detail-panel{max-height:82vh;border-radius:14px 14px 0 0}
    .detail-photo-wrap{height:160px}.detail-close{width:32px;height:32px;font-size:15px}
    .detail-header{padding:14px 16px}.detail-body{padding:14px 16px 24px}
    .detail-name-ar{font-size:22px}.detail-name-latin{font-size:15px}
    .detail-summary-en{font-size:13px}.detail-summary-ar{font-size:15px;padding:12px 14px}
    .detail-quote{font-size:16px}.date-badge{font-size:10px;padding:5px 10px}.coordinates{font-size:9px}
    .click-hint{font-size:10px;bottom:110px}
    .toolbar{bottom:52px;gap:4px}.tool-btn{width:38px;height:38px}
    .directory{width:260px}.directory-item .di-name{font-size:15px}
  }
  @media(max-width:360px){.logo h1{font-size:13px}.intro-overlay h2{font-size:22px}.detail-name-ar{font-size:20px}.detail-photo-wrap{height:130px}}
  @media(max-height:500px) and (orientation:landscape){
    .overlay-top{padding:10px 20px}.overlay-bottom{padding:8px 20px}.logo h1{font-size:14px}.logo .subtitle{display:none}
    .detail-overlay{align-items:center;justify-content:flex-end}
    .detail-panel{width:380px;max-width:50vw;max-height:94vh;margin-right:20px;border-radius:0;transform:translateX(100%)}
    .detail-overlay.visible .detail-panel{transform:translateX(0)}.detail-panel::before{display:none}.detail-photo-wrap{height:120px}
    .toolbar{bottom:48px}
  }
  @media(pointer:coarse){body,body:active{cursor:default}}
  @supports(padding:env(safe-area-inset-top)){.overlay-top{padding-top:max(14px,env(safe-area-inset-top))}.overlay-bottom{padding-bottom:max(12px,env(safe-area-inset-bottom))}.detail-panel{padding-bottom:env(safe-area-inset-bottom)}.toolbar{bottom:max(52px,calc(env(safe-area-inset-bottom) + 52px))}}
</style>

<script type="module">
import * as THREE from 'three';

const photoCache={};
async function fetchPhoto(slug,alts){
  if(photoCache[slug])return photoCache[slug];
  const slugs=[slug,...(alts||[])];
  for(const s of slugs){
    for(const lang of['en','fr']){
      try{
        const r=await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(s)}`);
        if(r.ok){const d=await r.json();const u=d.originalimage?.source||d.thumbnail?.source;
        if(u&&!u.includes('logo')&&!u.includes('icon')){photoCache[slug]=u;return u}}
      }catch(e){}
    }
  }
  return null;
}

const CARDS=[
  {name:"لعربي بن مهيدي",latin:"Larbi Ben M'hidi",year:"1923–1957",role:"Leader of Zone V (Oran)",color:"#8B4513",type:"HISTORIC LEADER",isPerson:true,wiki:"Larbi_Ben_M'hidi",
  summary:"One of the nine historic founders of the FLN and leader of Zone V. He commanded urban guerrilla operations during the Battle of Algiers. Captured in February 1957, he was tortured and assassinated by the French military who staged his death as a suicide.",
  summaryAr:"أحد المؤسسين التسعة التاريخيين لجبهة التحرير الوطني وقائد المنطقة الخامسة. قاد عمليات حرب العصابات الحضرية خلال معركة الجزائر. اعتُقل في فبراير 1957 وتعرض للتعذيب ثم اغتيل.",
  quote:"أعطونا طائراتكم ودباباتكم نعطيكم قفافنا"},
  {name:"مصطفى بن بولعيد",latin:"Mostefa Ben Boulaïd",year:"1917–1956",role:"Leader of Zone I (Aurès)",color:"#6B3410",type:"HISTORIC LEADER",isPerson:true,wiki:"Mostefa_Ben_Boulaïd",
  summary:"Known as the 'Father of the Revolution.' He sold his properties to buy the first weapons for November 1st, 1954. Killed by a booby-trapped radio planted by French intelligence.",
  summaryAr:"يُلقب بـ'أبو الثورة'. باع ممتلكاته لشراء أول أسلحة الثورة. استشهد في 22 مارس 1956 بجهاز راديو مفخخ زرعته المخابرات الفرنسية.",
  quote:"نموت ونحيا ونموت حتى تحيا الجزائر"},
  {name:"ديدوش مراد",latin:"Didouche Mourad",year:"1927–1955",role:"Leader of Zone II",color:"#4A5530",type:"HISTORIC LEADER",isPerson:true,wiki:"Didouche_Mourad",wikiAlt:["Mourad_Didouche"],

function mkTex(card){const c=document.createElement('canvas');c.width=512;c.height=640;const x=c.getContext('2d');const bg=x.createLinearGradient(0,0,0,640);bg.addColorStop(0,card.color);bg.addColorStop(1,dk(card.color,0.4));x.fillStyle=bg;x.fillRect(0,0,512,640);x.globalAlpha=0.08;for(let i=0;i<1500;i++){x.fillStyle=Math.random()>0.5?'#fff':'#000';x.fillRect(Math.random()*512,Math.random()*640,1,1)}x.globalAlpha=1;x.strokeStyle='rgba(201,169,110,0.3)';x.lineWidth=2;x.strokeRect(16,16,480,608);x.strokeRect(20,20,472,600);drawS(x,256,150,50,'#c9a96e',0.25);x.fillStyle='rgba(201,169,110,0.45)';x.font='12px sans-serif';x.textAlign='center';x.fillText((card.type||'').toUpperCase(),256,210);x.strokeStyle='rgba(201,169,110,0.4)';x.lineWidth=1;x.beginPath();x.moveTo(120,230);x.lineTo(392,230);x.stroke();x.fillStyle='#e8d5a8';x.font='bold 36px Amiri,serif';x.textBaseline='middle';x.fillText(card.name,256,285);x.fillStyle='rgba(201,169,110,0.9)';x.font='22px Playfair Display,serif';x.fillText(card.latin,256,335);x.fillStyle='rgba(201,169,110,0.6)';x.font='18px serif';x.fillText(card.year,256,385);x.strokeStyle='rgba(201,169,110,0.25)';x.beginPath();x.moveTo(160,415);x.lineTo(352,415);x.stroke();x.fillStyle='rgba(232,213,168,0.6)';x.font='15px serif';x.fillText(card.role,256,450);x.fillStyle='rgba(201,169,110,0.3)';x.font=isMobile?'12px sans-serif':'11px sans-serif';x.fillText(isMobile?'— TAP TO READ —':'— CLICK TO READ —',256,520);dC(x,30,30,1,1);dC(x,482,30,-1,1);dC(x,30,610,1,-1);dC(x,482,610,-1,-1);const t=new THREE.CanvasTexture(c);t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t}
function drawS(x,cx,cy,r,col,a){x.globalAlpha=a;x.fillStyle=col;x.beginPath();for(let i=0;i<5;i++){const an=(i*4*Math.PI)/5-Math.PI/2;i===0?x.moveTo(cx+r*Math.cos(an),cy+r*Math.sin(an)):x.lineTo(cx+r*Math.cos(an),cy+r*Math.sin(an))}x.closePath();x.fill();x.globalAlpha=a*0.8;x.strokeStyle=col;x.lineWidth=2;x.beginPath();x.arc(cx,cy,r*0.35,0,Math.PI*2);x.stroke();x.globalAlpha=1}
function dC(x,px,py,dx,dy){x.strokeStyle='rgba(201,169,110,0.25)';x.lineWidth=1;x.beginPath();x.moveTo(px,py+dy*20);x.lineTo(px,py);x.lineTo(px+dx*20,py);x.stroke()}
function dk(h,a){const n=parseInt(h.replace('#',''),16);return`rgb(${Math.max(0,((n>>16)&0xff)*(1-a))|0},${Math.max(0,((n>>8)&0xff)*(1-a))|0},${Math.max(0,(n&0xff)*(1-a))|0})`}

const CS=6,RR=isMobile?2:3,CW=2.4,CH=3,chunks=new Map(),texs=CARDS.map(c=>mkTex(c)),geo=new THREE.PlaneGeometry(CW,CH);
function cK(a,b){return`${a},${b}`}function cF(a,b){return Math.abs(((a*73856093)^(b*19349663))%CARDS.length)}
function mkCh(cx,cy){const k=cK(cx,cy);if(chunks.has(k))return;const g=new THREE.Group(),s=Math.abs((cx*7+cy*13)%17),cnt=2+(s%2);for(let i=0;i<cnt;i++){const ci=cF(cx+i*3,cy+i*7),mat=new THREE.MeshStandardMaterial({map:texs[ci],roughness:0.7,metalness:0.1,transparent:true,opacity:0}),m=new THREE.Mesh(geo,mat);m.position.set(cx*CS+((i*2.7+s*0.3)%CS)-CS/2,cy*CS+((i*3.1+s*0.7)%CS)-CS/2,-Math.random()*3);m.rotation.z=(Math.random()-0.5)*0.08;m.rotation.x=(Math.random()-0.5)*0.04;m.userData={material:mat,cardIndex:ci};g.add(m)}scene.add(g);chunks.set(k,g)}

function updCh(){const ccx=Math.round(camera.position.x/CS),ccy=Math.round(camera.position.y/CS);for(let dx=-RR;dx<=RR;dx++)for(let dy=-RR;dy<=RR;dy++)mkCh(ccx+dx,ccy+dy);for(const[k]of chunks){const[cx,cy]=k.split(',').map(Number);if(Math.abs(cx-ccx)>RR+1||Math.abs(cy-ccy)>RR+1)rmCh(cx,cy)}}

async function showDetail(i){
  const c=CARDS[i],photo=document.getElementById('detailPhoto'),loadTxt=document.getElementById('loadingText'),locEl=document.getElementById('detailLocation');
  document.getElementById('detailType').textContent=c.type;
  document.getElementById('detailNameAr').textContent=c.name;
  document.getElementById('detailNameLatin').textContent=c.latin;
  document.getElementById('detailYears').textContent=c.year;
  document.getElementById('detailRole').textContent=c.role;
  document.getElementById('detailSummaryEn').textContent=c.summary;
  document.getElementById('detailSummaryAr').textContent=c.summaryAr;
  document.getElementById('detailQuote').textContent=`« ${c.quote} »`;
  if(c.location){locEl.textContent=c.location;locEl.style.display='flex'}else{locEl.style.display='none'}
  photo.classList.remove('loaded','is-person');photo.src='';loadTxt.textContent='Loading photo...';
  if(c.isPerson) photo.classList.add('is-person');
  dOv.classList.add('visible');document.body.classList.add('panel-open');panelOpen=true;
  // Scroll panel to top
  document.getElementById('detailPanel').scrollTop=0;
  if(c.directPhoto){
    // Try direct URL first (for cases where Wikipedia returns wrong photo)
    photo.src=c.directPhoto;
    photo.onload=()=>{photo.classList.add('loaded');loadTxt.textContent=''};
    photo.onerror=async()=>{
      // Fallback to Wikipedia API
      if(c.wiki){const url=await fetchPhoto(c.wiki,c.wikiAlt);if(url){photo.src=url;photo.onload=()=>{photo.classList.add('loaded');loadTxt.textContent=''};photo.onerror=()=>{loadTxt.textContent='Photo unavailable'}}else{loadTxt.textContent='Photo unavailable'}}
    };
  } else if(c.wiki){const url=await fetchPhoto(c.wiki,c.wikiAlt);if(url){photo.src=url;photo.onload=()=>{photo.classList.add('loaded');loadTxt.textContent=''};photo.onerror=()=>{loadTxt.textContent='Photo unavailable'}}else{loadTxt.textContent='Photo unavailable'}}
}
function hideDetail(){dOv.classList.remove('visible');document.body.classList.remove('panel-open');panelOpen=false;fTarget=null}

let dirOpen=false;
const dirEl=document.getElementById('directory'),dirBk=document.getElementById('dirBackdrop');
function buildDir(){
  const cont=document.getElementById('dirContent');
  const groups={};
  CARDS.forEach((c,i)=>{const t=c.type;if(!groups[t])groups[t]=[];groups[t].push({...c,idx:i})});
  let html='';
  for(const[type,items]of Object.entries(groups)){
    html+=`<div class="directory-section">${type}</div>`;
    items.forEach(c=>{html+=`<div class="directory-item" data-idx="${c.idx}"><div class="di-dot" style="background:${c.color}"></div><div class="di-info"><div class="di-name">${c.name}</div><div class="di-latin">${c.latin} · ${c.year}</div></div></div>`});
  }
  cont.innerHTML=html;
  cont.querySelectorAll('.directory-item').forEach(el=>{el.addEventListener('click',()=>{const i=parseInt(el.dataset.idx);closeDir();showDetail(i)})});
}
function openDir(){dirEl.classList.add('open');dirBk.classList.add('visible');dirOpen=true}
function closeDir(){dirEl.classList.remove('open');dirBk.classList.remove('visible');dirOpen=false}
document.getElementById('dirClose').addEventListener('click',closeDir);
dirBk.addEventListener('click',closeDir);

const DSP=isMobile?0.008:0.012;

renderer.domElement.addEventListener('pointerdown',e=>{if(panelOpen||dirOpen)return;drag=true;prev={x:e.clientX,y:e.clientY};cStart={x:e.clientX,y:e.clientY};wasDrag=false});
window.addEventListener('pointermove',e=>{if(!drag||panelOpen||dirOpen)return;vel.x-=(e.clientX-prev.x)*DSP;vel.y+=(e.clientY-prev.y)*DSP;prev={x:e.clientX,y:e.clientY};if(Math.abs(e.clientX-cStart.x)+Math.abs(e.clientY-cStart.y)>(isMobile?12:6))wasDrag=true});
window.addEventListener('pointerup',e=>{drag=false;if(!wasDrag&&!panelOpen&&!dirOpen){mV.x=(e.clientX/window.innerWidth)*2-1;mV.y=-(e.clientY/window.innerHeight)*2+1;ray.setFromCamera(mV,camera);const ms=[];scene.traverse(c=>{if(c.isMesh&&c.userData.cardIndex!==undefined)ms.push(c)});const h=ray.intersectObjects(ms);if(h.length>0){const o=h[0].object;fTarget=o;fProg=0;fStart.copy(camera.position);fEnd.set(o.position.x,o.position.y,o.position.z+5);vel.x=0;vel.y=0;vel.z=0;setTimeout(()=>showDetail(o.userData.cardIndex),400)}}});
renderer.domElement.addEventListener('wheel',e=>{if(panelOpen||dirOpen)return;e.preventDefault();vel.z+=e.deltaY*0.003},{passive:false});
let lTD=0;
renderer.domElement.addEventListener('touchstart',e=>{if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;lTD=Math.sqrt(dx*dx+dy*dy)}},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2&&!panelOpen&&!dirOpen){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,d=Math.sqrt(dx*dx+dy*dy);vel.z+=(lTD-d)*0.006;lTD=d}},{passive:true});
const keys={};window.addEventListener('keydown',e=>{if(!panelOpen&&!dirOpen)keys[e.key]=true});window.addEventListener('keyup',e=>keys[e.key]=false);
function pK(){if(panelOpen||dirOpen)return;const s=0.04;if(keys.ArrowLeft||keys.a)vel.x-=s;if(keys.ArrowRight||keys.d)vel.x+=s;if(keys.ArrowUp||keys.w)vel.y+=s;if(keys.ArrowDown||keys.s)vel.y-=s}

// ── TOOLBAR ACTIONS ──
document.getElementById('btnHome').addEventListener('click',()=>{fTarget={position:{x:0,y:0,z:0}};fProg=0;fStart.copy(camera.position);fEnd.set(0,0,12);vel.x=0;vel.y=0;vel.z=0});
document.getElementById('btnDir').addEventListener('click',openDir);
document.getElementById('btnZoomIn').addEventListener('click',()=>{vel.z-=0.3});
document.getElementById('btnZoomOut').addEventListener('click',()=>{vel.z+=0.3});

const coordsEl=document.getElementById('coords'),clickHint=document.getElementById('clickHint');
let time=0,hD=false;
function animate(){requestAnimationFrame(animate);time+=0.01;
if(!hD&&time>3){clickHint.classList.add('visible');hD=true;setTimeout(()=>clickHint.classList.remove('visible'),5000)}
pK();
if(fTarget&&fProg<1){fProg=Math.min(fProg+(isMobile?0.018:0.025),1);camera.position.lerpVectors(fStart,fEnd,1-Math.pow(1-fProg,3))}
else if(!panelOpen&&!dirOpen){vel.x*=DMP;vel.y*=DMP;vel.z*=DMP;camera.position.x+=vel.x;camera.position.y+=vel.y;camera.position.z=Math.max(4,Math.min(20,camera.position.z+vel.z))}
pl1.position.set(camera.position.x+5,camera.position.y+5,camera.position.z+2);
pl2.position.set(camera.position.x-5,camera.position.y-3,camera.position.z+1);
pts.position.x+=(camera.position.x-pts.position.x)*0.01;pts.position.y+=(camera.position.y-pts.position.y)*0.01;
const pp=pG.attributes.position.array;for(let i=0;i<pN;i++){pp[i*3+1]+=Math.sin(time+i)*0.001;pp[i*3]+=Math.cos(time*0.7+i*0.5)*0.0005}pG.attributes.position.needsUpdate=true;
updCh();updFade();
coordsEl.textContent=`X: ${camera.position.x.toFixed(2)}  Y: ${camera.position.y.toFixed(2)}  Z: ${camera.position.z.toFixed(2)}`;
renderer.render(scene,camera)}

window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)});
document.getElementById('enterBtn').addEventListener('click',()=>{
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('toolbar').style.display='flex';
  if(isMobile){document.getElementById('navHint').innerHTML='Swipe to explore · Pinch to zoom<br>Tap a card to read';document.getElementById('clickHint').textContent='Tap on a card to learn more'}
  buildDir();animate();
});
</script>
</body>
</html>
